<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
      layout:decorator="layout/layout">
<meta charset="UTF-8">
<title>数据分析</title>
<body>
<li layout:fragment="data_analysis" class="active">
    <a th:href="@{/queue/analysis/page}">
        <i class="menu-icon fa fa-bar-chart"></i>
        <span class="menu-text">数据分析</span>
    </a>
    <b class="arrow"></b>
</li>

<div layout:fragment="content" class="main-content">
    <div class="main-content-inner">
        <div class="breadcrumbs ace-save-state" id="breadcrumbs">
            <ul class="breadcrumb">
                <li>
                    <i class="ace-icon fa fa-home home-icon"></i>
                    <a href="#">首页</a>
                </li>
                <li class="active">数据分析</li>
            </ul>
        </div>

        <div class="page-content">
            <div class="page-header">
                <h1>
                    数据分析
                    <small>
                        <i class="ace-icon fa fa-angle-double-right"></i>
                        业务办理统计与分析
                    </small>
                </h1>
            </div>

            <div class="row">
                <div class="col-xs-12">
                    <!-- 时间筛选区 -->
                    <div class="row">
                        <div class="col-xs-12">
                            <div class="widget-box">
                                <div class="widget-header widget-header-flat widget-header-small">
                                    <h5 class="widget-title">
                                        <i class="ace-icon fa fa-calendar"></i>
                                        查询条件
                                    </h5>
                                </div>
                                <div class="widget-body">
                                    <div class="widget-main">
                                        <div class="form-horizontal">
                                            <div class="form-group">
                                                <label class="col-sm-2 control-label">时间类型:</label>
                                                <div class="col-sm-10">
                                                    <div class="btn-group" data-toggle="buttons">
                                                        <label class="btn btn-sm btn-primary active" onclick="changeTimeType(0)">
                                                            <input type="radio" name="timeType" value="0" checked/> 日
                                                        </label>
                                                        <label class="btn btn-sm btn-primary" onclick="changeTimeType(1)">
                                                            <input type="radio" name="timeType" value="1"/> 周
                                                        </label>
                                                        <label class="btn btn-sm btn-primary" onclick="changeTimeType(2)">
                                                            <input type="radio" name="timeType" value="2"/> 月
                                                        </label>
                                                        <label class="btn btn-sm btn-primary" onclick="changeTimeType(3)">
                                                            <input type="radio" name="timeType" value="3"/> 年
                                                        </label>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="form-group">
                                                <label class="col-sm-2 control-label">日期:</label>
                                                <div class="col-sm-4">
                                                    <input type="text" id="dateInput" class="form-control" placeholder="请选择日期"/>
                                                </div>
                                                <div class="col-sm-4">
                                                    <button class="btn btn-info" onclick="loadAllData()">
                                                        <i class="ace-icon fa fa-search"></i> 查询
                                                    </button>
                                                    <button class="btn btn-warning" onclick="resetQuery()">
                                                        <i class="ace-icon fa fa-refresh"></i> 重置
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="space-12"></div>

                    <!-- 综合统计卡片 -->
                    <div class="row">
                        <div class="col-sm-12">
                            <h4 class="lighter">
                                <i class="ace-icon fa fa-dashboard orange"></i>
                                综合统计概览
                            </h4>
                        </div>
                    </div>

                    <div class="space-6"></div>

                    <div class="row">
                        <div class="col-sm-12 infobox-container">
                            <div class="infobox infobox-blue">
                                <div class="infobox-icon">
                                    <i class="ace-icon fa fa-list-alt"></i>
                                </div>
                                <div class="infobox-data">
                                    <span class="infobox-data-number" id="totalCount">0</span>
                                    <div class="infobox-content">总办理量</div>
                                </div>
                            </div>

                            <div class="infobox infobox-green">
                                <div class="infobox-icon">
                                    <i class="ace-icon fa fa-clock-o"></i>
                                </div>
                                <div class="infobox-data">
                                    <span class="infobox-data-number" id="avgDuration">0</span>
                                    <div class="infobox-content">平均时长(秒)</div>
                                </div>
                            </div>

                            <div class="infobox infobox-orange">
                                <div class="infobox-icon">
                                    <i class="ace-icon fa fa-thumbs-up"></i>
                                </div>
                                <div class="infobox-data">
                                    <span class="infobox-data-number" id="goodCount">0</span>
                                    <div class="infobox-content">好评数量</div>
                                </div>
                            </div>

                            <div class="infobox infobox-pink">
                                <div class="infobox-icon">
                                    <i class="ace-icon fa fa-percent"></i>
                                </div>
                                <div class="infobox-data">
                                    <span class="infobox-data-number" id="goodRate">0%</span>
                                    <div class="infobox-content">好评率</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="hr hr32 hr-dotted"></div>

                    <!-- 业务办理量统计 -->
                    <div class="row">
                        <div class="col-sm-6">
                            <div class="widget-box">
                                <div class="widget-header widget-header-flat widget-header-small">
                                    <h5 class="widget-title">
                                        <i class="ace-icon fa fa-pie-chart"></i>
                                        业务办理量统计
                                    </h5>
                                </div>
                                <div class="widget-body">
                                    <div class="widget-main">
                                        <table id="bizHandleTable" class="table table-striped table-bordered table-hover">
                                            <thead>
                                            <tr>
                                                <th>业务名称</th>
                                                <th>办理数量</th>
                                            </tr>
                                            </thead>
                                            <tbody>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 人员工作量统计 -->
                        <div class="col-sm-6">
                            <div class="widget-box">
                                <div class="widget-header widget-header-flat widget-header-small">
                                    <h5 class="widget-title">
                                        <i class="ace-icon fa fa-users"></i>
                                        人员工作量统计
                                    </h5>
                                </div>
                                <div class="widget-body">
                                    <div class="widget-main">
                                        <table id="userWorkloadTable" class="table table-striped table-bordered table-hover">
                                            <thead>
                                            <tr>
                                                <th>人员姓名</th>
                                                <th>办理数量</th>
                                            </tr>
                                            </thead>
                                            <tbody>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="hr hr32 hr-dotted"></div>

                    <!-- 办理时长统计 -->
                    <div class="row">
                        <div class="col-sm-12">
                            <div class="widget-box">
                                <div class="widget-header widget-header-flat widget-header-small">
                                    <h5 class="widget-title">
                                        <i class="ace-icon fa fa-clock-o"></i>
                                        业务办理时长统计
                                    </h5>
                                </div>
                                <div class="widget-body">
                                    <div class="widget-main">
                                        <table id="durationTable" class="table table-striped table-bordered table-hover">
                                            <thead>
                                            <tr>
                                                <th>业务名称</th>
                                                <th>办理数量</th>
                                                <th>平均时长(秒)</th>
                                                <th>最大时长(秒)</th>
                                                <th>最小时长(秒)</th>
                                            </tr>
                                            </thead>
                                            <tbody>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="hr hr32 hr-dotted"></div>

                    <!-- 人员详细统计 -->
                    <div class="row">
                        <div class="col-sm-12">
                            <div class="widget-box">
                                <div class="widget-header widget-header-flat widget-header-small">
                                    <h5 class="widget-title">
                                        <i class="ace-icon fa fa-table"></i>
                                        人员详细统计(含评价)
                                    </h5>
                                </div>
                                <div class="widget-body">
                                    <div class="widget-main">
                                        <table id="userDetailTable" class="table table-striped table-bordered table-hover">
                                            <thead>
                                            <tr>
                                                <th>人员姓名</th>
                                                <th>办理数量</th>
                                                <th>平均时长(秒)</th>
                                                <th>好评数</th>
                                                <th>中评数</th>
                                                <th>差评数</th>
                                                <th>好评率(%)</th>
                                            </tr>
                                            </thead>
                                            <tbody>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="selfScript">
    <script type="text/javascript">
        var currentTimeType = 0;

        $(document).ready(function() {
            // 初始化日期选择器
            initDatePicker();
            // 加载所有数据
            loadAllData();
        });

        function initDatePicker() {
            var today = new Date();
            var dateStr = formatDate(today);
            $('#dateInput').val(dateStr);
        }

        function formatDate(date) {
            var year = date.getFullYear();
            var month = ("0" + (date.getMonth() + 1)).slice(-2);
            var day = ("0" + date.getDate()).slice(-2);
            return year + "-" + month + "-" + day;
        }

        function changeTimeType(type) {
            currentTimeType = type;
        }

        function resetQuery() {
            currentTimeType = 0;
            $('input[name="timeType"][value="0"]').prop('checked', true);
            initDatePicker();
            loadAllData();
        }

        function loadAllData() {
            var dateStr = $('#dateInput').val();
            
            // 加载综合统计
            loadComprehensiveStats(dateStr);
            // 加载业务办理量统计
            loadBizHandleStats(dateStr);
            // 加载人员工作量统计
            loadUserWorkloadStats(dateStr);
            // 加载办理时长统计
            loadDurationStats(dateStr);
            // 加载人员详细统计
            loadUserDetailStats(dateStr);
        }

        function loadComprehensiveStats(dateStr) {
            $.ajax({
                url: '/queue/analysis/comprehensiveStats',
                type: 'GET',
                data: {
                    timeType: currentTimeType,
                    dateStr: dateStr
                },
                success: function(response) {
                    if (response.restCode === 0 && response.restData) {
                        var data = response.restData;
                        $('#totalCount').text(data.count || 0);
                        $('#avgDuration').text(data.avgDuration ? data.avgDuration.toFixed(2) : 0);
                        $('#goodCount').text(data.goodCount || 0);
                        $('#goodRate').text((data.goodRate || 0) + '%');
                    }
                },
                error: function() {
                    console.error('加载综合统计失败');
                }
            });
        }

        function loadBizHandleStats(dateStr) {
            $.ajax({
                url: '/queue/analysis/bizHandleStats',
                type: 'GET',
                data: {
                    timeType: currentTimeType,
                    dateStr: dateStr
                },
                success: function(response) {
                    if (response.restCode === 0 && response.restData) {
                        var tbody = $('#bizHandleTable tbody');
                        tbody.empty();
                        
                        $.each(response.restData, function(index, item) {
                            var row = '<tr>' +
                                '<td>' + (item.bizName || '-') + '</td>' +
                                '<td><span class="badge badge-info">' + (item.count || 0) + '</span></td>' +
                                '</tr>';
                            tbody.append(row);
                        });
                        
                        if (response.restData.length === 0) {
                            tbody.append('<tr><td colspan="2" class="center">暂无数据</td></tr>');
                        }
                    }
                },
                error: function() {
                    console.error('加载业务办理量统计失败');
                }
            });
        }

        function loadUserWorkloadStats(dateStr) {
            $.ajax({
                url: '/queue/analysis/userWorkloadStats',
                type: 'GET',
                data: {
                    timeType: currentTimeType,
                    dateStr: dateStr
                },
                success: function(response) {
                    if (response.restCode === 0 && response.restData) {
                        var tbody = $('#userWorkloadTable tbody');
                        tbody.empty();
                        
                        $.each(response.restData, function(index, item) {
                            var row = '<tr>' +
                                '<td>' + (item.userName || '-') + '</td>' +
                                '<td><span class="badge badge-success">' + (item.count || 0) + '</span></td>' +
                                '</tr>';
                            tbody.append(row);
                        });
                        
                        if (response.restData.length === 0) {
                            tbody.append('<tr><td colspan="2" class="center">暂无数据</td></tr>');
                        }
                    }
                },
                error: function() {
                    console.error('加载人员工作量统计失败');
                }
            });
        }

        function loadDurationStats(dateStr) {
            $.ajax({
                url: '/queue/analysis/durationStats',
                type: 'GET',
                data: {
                    timeType: currentTimeType,
                    dateStr: dateStr
                },
                success: function(response) {
                    if (response.restCode === 0 && response.restData) {
                        var tbody = $('#durationTable tbody');
                        tbody.empty();
                        
                        $.each(response.restData, function(index, item) {
                            var row = '<tr>' +
                                '<td>' + (item.bizName || '-') + '</td>' +
                                '<td>' + (item.count || 0) + '</td>' +
                                '<td>' + (item.avgDuration ? item.avgDuration.toFixed(2) : 0) + '</td>' +
                                '<td>' + (item.maxDuration ? item.maxDuration.toFixed(2) : 0) + '</td>' +
                                '<td>' + (item.minDuration ? item.minDuration.toFixed(2) : 0) + '</td>' +
                                '</tr>';
                            tbody.append(row);
                        });
                        
                        if (response.restData.length === 0) {
                            tbody.append('<tr><td colspan="5" class="center">暂无数据</td></tr>');
                        }
                    }
                },
                error: function() {
                    console.error('加载办理时长统计失败');
                }
            });
        }

        function loadUserDetailStats(dateStr) {
            $.ajax({
                url: '/queue/analysis/userDetailStats',
                type: 'GET',
                data: {
                    timeType: currentTimeType,
                    dateStr: dateStr
                },
                success: function(response) {
                    if (response.restCode === 0 && response.restData) {
                        var tbody = $('#userDetailTable tbody');
                        tbody.empty();
                        
                        $.each(response.restData, function(index, item) {
                            var row = '<tr>' +
                                '<td>' + (item.userName || '-') + '</td>' +
                                '<td>' + (item.count || 0) + '</td>' +
                                '<td>' + (item.avgDuration ? item.avgDuration.toFixed(2) : 0) + '</td>' +
                                '<td><span class="label label-success">' + (item.goodCount || 0) + '</span></td>' +
                                '<td><span class="label label-warning">' + (item.mediumCount || 0) + '</span></td>' +
                                '<td><span class="label label-danger">' + (item.badCount || 0) + '</span></td>' +
                                '<td><strong>' + (item.goodRate || 0) + '%</strong></td>' +
                                '</tr>';
                            tbody.append(row);
                        });
                        
                        if (response.restData.length === 0) {
                            tbody.append('<tr><td colspan="7" class="center">暂无数据</td></tr>');
                        }
                    }
                },
                error: function() {
                    console.error('加载人员详细统计失败');
                }
            });
        }
    </script>
</th:block>

</body>
</html>
